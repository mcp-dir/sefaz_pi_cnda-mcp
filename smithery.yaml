# Smithery configuration for SEFAZ PI: Solicitar Certidão Negativa da Dívida Ativa (CNDA)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_pi_cnda

name: sefaz_pi_cnda-mcp
displayName: "SEFAZ PI: Solicitar Certidão Negativa da Dívida Ativa (CNDA)"
description: >
  SEFAZ PI: Solicitar Certidão Negativa da Dívida Ativa (CNDA), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_pi_cnda-mcp
repository: https://github.com/mcp-dir/sefaz_pi_cnda-mcp

tags:
  - sefaz_pi_cnda
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_pi_cnda

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_pi_cnda/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
